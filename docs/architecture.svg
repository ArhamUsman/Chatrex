<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc" fill="#152b40">
  <title id="title">ChatreX two-router routed lab architecture</title>
  <desc id="desc">Client, router one, router two, and relay server across three subnets, with IP addresses, relay ports, symmetric netem delay, and TLS and end-to-end trust boundaries.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123c59"/>
    </linearGradient>
    <linearGradient id="serverFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#e3f1fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2176a8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#168365"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60778c"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #ffffff; letter-spacing: .2px; }
      .subtitle { font-size: 15px; fill: #c7dfed; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.7px; fill: #42647e; }
      .node-title { font-size: 20px; font-weight: 700; }
      .node-sub { font-size: 12px; font-weight: 600; fill: #557086; letter-spacing: .8px; }
      .node-text { font-size: 14px; fill: #29465d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .subnet { font-size: 13px; font-weight: 700; fill: #315b77; }
      .link-label { font-size: 12px; font-weight: 600; fill: #2176a8; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-text { font-size: 13px; fill: #3b556a; }
      .small { font-size: 12px; fill: #5a7286; }
      .legend { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f5f8fc"/>
  <rect width="1600" height="112" fill="url(#header)"/>
  <text class="title" x="48" y="49">ChatreX · Routed measurement architecture</text>
  <text class="subtitle" x="48" y="80">Two routers · three subnets · immediate TLS 1.3 · verified X25519 NaCl Box E2E</text>
  <rect x="1280" y="34" width="272" height="43" rx="21.5" fill="#ffffff" fill-opacity="0.11" stroke="#b7d9e9" stroke-opacity="0.35"/>
  <text x="1416" y="61" text-anchor="middle" font-size="13" font-weight="700" fill="#e6f6ff">PROJECT 2 · COMMON DIAGRAM</text>

  <text class="section" x="45" y="150">01 / NETWORK TOPOLOGY</text>

  <g>
    <rect x="230" y="170" width="270" height="38" rx="19" fill="#e6eff6"/>
    <text class="subnet" x="365" y="194" text-anchor="middle">SUBNET 1 · 10.0.1.0/24</text>
    <rect x="655" y="170" width="290" height="38" rx="19" fill="#e6eff6"/>
    <text class="subnet" x="800" y="194" text-anchor="middle">SUBNET 2 · 10.0.2.0/24</text>
    <rect x="1100" y="170" width="280" height="38" rx="19" fill="#e6eff6"/>
    <text class="subnet" x="1240" y="194" text-anchor="middle">SUBNET 3 · 10.0.3.0/24</text>
  </g>

  <!-- Device cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="245" width="265" height="225" rx="16" fill="#ffffff" stroke="#87af9f" stroke-width="2"/>
    <rect x="390" y="245" width="250" height="225" rx="16" fill="#ffffff" stroke="#b4c3d0"/>
    <rect x="810" y="245" width="250" height="225" rx="16" fill="#ffffff" stroke="#b4c3d0"/>
    <rect x="1280" y="245" width="275" height="225" rx="16" fill="url(#serverFill)" stroke="#6b9fbd" stroke-width="2"/>
  </g>

  <g>
    <circle cx="75" cy="277" r="12" fill="#168365"/>
    <text class="node-title" x="98" y="284">Client</text>
    <text class="node-sub" x="67" y="309">CLIENT NAMESPACE</text>
    <text class="node-text mono" x="67" y="342">veth-client</text>
    <text class="node-text mono" x="67" y="365">10.0.1.10/24</text>
    <text class="node-text" x="67" y="398">Default via 10.0.1.1</text>
    <text class="node-text" x="67" y="428">Sender + interactive CLI</text>
    <text class="small" x="67" y="450">E2E private identity stays here</text>
  </g>

  <g>
    <circle cx="420" cy="277" r="12" fill="#60778c"/>
    <text class="node-title" x="443" y="284">Router R1</text>
    <text class="node-sub" x="412" y="309">FORWARDING + NETEM</text>
    <text class="node-text mono" x="412" y="340">veth-r1-a  10.0.1.1/24</text>
    <text class="node-text mono" x="412" y="366">veth-r1-b  10.0.2.1/24</text>
    <text class="node-text" x="412" y="399">Route to 10.0.3.0/24</text>
    <text class="node-text" x="412" y="422">via 10.0.2.2</text>
    <text class="small" x="412" y="451">Egress delay on veth-r1-b</text>
  </g>

  <g>
    <circle cx="840" cy="277" r="12" fill="#60778c"/>
    <text class="node-title" x="863" y="284">Router R2</text>
    <text class="node-sub" x="832" y="309">FORWARDING + NETEM</text>
    <text class="node-text mono" x="832" y="340">veth-r2-b  10.0.2.2/24</text>
    <text class="node-text mono" x="832" y="366">veth-r2-c  10.0.3.1/24</text>
    <text class="node-text" x="832" y="399">Route to 10.0.1.0/24</text>
    <text class="node-text" x="832" y="422">via 10.0.2.1</text>
    <text class="small" x="832" y="451">Egress delay on veth-r2-b</text>
  </g>

  <g>
    <circle cx="1310" cy="277" r="12" fill="#2176a8"/>
    <text class="node-title" x="1333" y="284">Relay server</text>
    <text class="node-sub" x="1302" y="309">SERVER NAMESPACE</text>
    <text class="node-text mono" x="1302" y="340">veth-server  10.0.3.10/24</text>
    <text class="node-text" x="1302" y="367">Default via 10.0.3.1</text>
    <rect x="1302" y="386" width="108" height="30" rx="7" fill="#fff1e8" stroke="#d78c58"/>
    <text x="1356" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#a45122">8080 · PLAIN</text>
    <rect x="1420" y="386" width="115" height="30" rx="7" fill="#e4f3fb" stroke="#6b9fbd"/>
    <text x="1477" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#1c648d">8443 · TLS/E2E</text>
    <text class="small" x="1302" y="441">Relay + separate echo ChatClient</text>
    <text class="small" x="1302" y="459">Echo also targets 10.0.3.10</text>
  </g>

  <!-- Subnet links -->
  <line x1="310" y1="350" x2="390" y2="350" stroke="#60778c" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <line x1="1060" y1="350" x2="1280" y2="350" stroke="#60778c" stroke-width="3" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>

  <!-- Explicit request and response delay directions -->
  <line x1="640" y1="319" x2="810" y2="319" stroke="#2176a8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="link-label" x="725" y="291" text-anchor="middle">request → +D</text>
  <line x1="810" y1="393" x2="640" y2="393" stroke="#2176a8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="link-label" x="725" y="424" text-anchor="middle">response → +D</text>
  <rect x="659" y="333" width="132" height="39" rx="19.5" fill="#eaf4fa" stroke="#88b5cd"/>
  <text x="725" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#1c648d">D = RTT / 2</text>

  <text class="section" x="45" y="529">02 / SECURITY TRUST BOUNDARIES</text>

  <!-- Trust cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="558" width="470" height="230" rx="16" fill="#ffffff" stroke="#67ad96" stroke-width="2"/>
    <rect x="565" y="558" width="470" height="230" rx="16" fill="#ffffff" stroke="#b4c3d0"/>
    <rect x="1085" y="558" width="470" height="230" rx="16" fill="#ffffff" stroke="#7caac4" stroke-width="2"/>
  </g>

  <g>
    <rect x="45" y="558" width="470" height="48" rx="16" fill="#e8f6f0"/>
    <path d="M45 590 H515 V606 H45 Z" fill="#e8f6f0"/>
    <text class="card-title" x="69" y="589" fill="#126a52">E2E endpoint boundary · sender + recipient</text>
    <text class="card-text" x="69" y="636">Private X25519 identity and trust store remain local.</text>
    <text class="card-text" x="69" y="663">Compare full SHA-256 fingerprints out of band; then /verify.</text>
    <text class="card-text" x="69" y="690">NaCl Box plaintext exists only at intended endpoints.</text>
    <text class="small" x="69" y="724">Static identities: no E2E forward secrecy.</text>
    <text class="small" x="69" y="751">Unverified recipients block E2E sending.</text>
  </g>

  <g>
    <rect x="565" y="558" width="470" height="48" rx="16" fill="#edf1f5"/>
    <path d="M565 590 H1035 V606 H565 Z" fill="#edf1f5"/>
    <text class="card-title" x="589" y="589" fill="#4e6478">Untrusted network · R1 + R2</text>
    <text class="card-text" x="589" y="636">Routers forward IPv4/TCP; they hold no TLS or E2E keys.</text>
    <text class="card-text" x="589" y="663">Both inter-router egress directions add D = RTT/2.</text>
    <text class="card-text" x="589" y="690">Addresses, ports, packet sizes, and timing remain visible.</text>
    <text class="small" x="589" y="724">Capture point: r1 / veth-r1-b.</text>
    <text class="small" x="589" y="751">Capture filter selects 10.0.3.10 and TCP 8080 or 8443.</text>
  </g>

  <g>
    <rect x="1085" y="558" width="470" height="48" rx="16" fill="#e9f4fa"/>
    <path d="M1085 590 H1555 V606 H1085 Z" fill="#e9f4fa"/>
    <text class="card-title" x="1109" y="589" fill="#1c648d">TLS termination + relay application boundary</text>
    <text class="card-text" x="1109" y="636">Local CA authenticates the relay; TLS starts before frames.</text>
    <text class="card-text" x="1109" y="663">Plain/TLS message content is readable by the relay.</text>
    <text class="card-text" x="1109" y="690">E2E relay sees metadata, nonce, and ciphertext—not plaintext.</text>
    <text class="small" x="1109" y="724">Registration credentials and room metadata remain visible.</text>
    <text class="small" x="1109" y="751">TLS key logs are test-only secrets; never publish them.</text>
  </g>

  <!-- Protection legend -->
  <line x1="62" y1="833" x2="122" y2="833" stroke="#2176a8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="legend" x="140" y="838" fill="#1c648d">TLS 1.3 · client ↔ relay · TCP 8443 · terminates at relay</text>
  <line x1="810" y1="833" x2="870" y2="833" stroke="#168365" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="legend" x="888" y="838" fill="#126a52">E2E NaCl Box · sender ↔ recipient only</text>

  <rect x="45" y="868" width="1510" height="44" rx="10" fill="#eaf0f6"/>
  <text class="small" x="800" y="895" text-anchor="middle">Lab connections always target 10.0.3.10 (never localhost). NiceGUI TCP 8081 is a separate local web interface, not a relay port.</text>
</svg>
